<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#fffbeb"/>
  
  <g transform="translate(0, 30)">
    <!-- Cat Ears -->
    <path d="M 120 180 L 100 70 L 200 120 Z" fill="#fbd24e" stroke="#57413d" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 392 180 L 412 70 L 312 120 Z" fill="#fbd24e" stroke="#57413d" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Inner ears -->
    <path d="M 125 140 L 120 90 L 165 115 Z" fill="#f9a8d4" />
    <path d="M 387 140 L 392 90 L 347 115 Z" fill="#f9a8d4" />

    <!-- Antenna -->
    <path d="M 180 140 L 160 80" stroke="#57413d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="160" cy="80" r="16" fill="#4ade80" stroke="#57413d" stroke-width="12"/>

    <path d="M 332 140 L 352 80" stroke="#57413d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="80" r="16" fill="#4ade80" stroke="#57413d" stroke-width="12"/>
    
    <!-- TV Body -->
    <rect x="76" y="140" width="360" height="260" rx="80" fill="#ffb833" stroke="#57413d" stroke-width="24" stroke-linejoin="round"/>
    
    <!-- TV Screen -->
    <rect x="116" y="180" width="280" height="150" rx="40" fill="#e0f2fe" stroke="#57413d" stroke-width="24" stroke-linejoin="round"/>
    
    <!-- Face inside screen -->
    <!-- Eyes -->
    <ellipse cx="190" cy="240" rx="12" ry="22" fill="#57413d"/>
    <circle cx="190" cy="230" r="6" fill="#ffffff"/>
    
    <ellipse cx="322" cy="240" rx="12" ry="22" fill="#57413d"/>
    <circle cx="322" cy="230" r="6" fill="#ffffff"/>
    
    <!-- Cheeks -->
    <ellipse cx="145" cy="265" rx="18" ry="10" fill="#f9a8d4"/>
    <ellipse cx="367" cy="265" rx="18" ry="10" fill="#f9a8d4"/>
    
    <!-- Mouth W shape -->
    <path d="M 236 250 Q 246 265 256 250 Q 266 265 276 250" fill="none" stroke="#57413d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Controls below screen -->
    <circle cx="256" cy="360" r="24" fill="#4ade80" stroke="#57413d" stroke-width="12"/>
    <path d="M 248 350 L 268 360 L 248 370 Z" fill="#57413d" stroke="#57413d" stroke-width="4" stroke-linejoin="round"/>
    
    <circle cx="150" cy="360" r="12" fill="#f9a8d4" stroke="#57413d" stroke-width="8"/>
    <circle cx="362" cy="360" r="12" fill="#60a5fa" stroke="#57413d" stroke-width="8"/>
  </g>
</svg>
